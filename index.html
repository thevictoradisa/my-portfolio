<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Victor Adisa — one person, a full marketing agency</title>
<meta name="description" content="Victor Adisa — strategy, content, video, design, websites, ads and analytics, all under one roof. Book a free strategy call.">
<meta name="theme-color" content="#0a0a0a">
<meta property="og:title" content="Victor Adisa — one person, a full marketing agency">
<meta property="og:description" content="Strategy, content, video, design, websites, ads and analytics — all under one roof.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   VIKADY — single screen
   One card. Nothing to scroll. Six text styles, three links.
   ============================================================ */
:root{
  --bg:#0a0a0a;
  /* Grey ladder — every step that carries text clears AA (4.5:1)
     composited on #0a0a0a. Ratios measured, not estimated. */
  --white:rgba(255,255,255,1);   /* 19.80:1  wordmark          */
  --bright:rgba(255,255,255,.88);/* 15.28:1  the figure         */
  --body:rgba(255,255,255,.70);  /*  9.76:1  the one prose line */
  --mid:rgba(255,255,255,.58);   /*  6.86:1  link row           */
  --label:rgba(255,255,255,.50); /*  5.29:1  mono labels        */
  --line:rgba(255,255,255,.10);  /*  borders only, never text   */
  --red:#e31212;

  --fh:'Syne',sans-serif;
  --fb:'Inter',system-ui,-apple-system,sans-serif;
  --fm:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--body);
  font-family:var(--fb);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
::selection{background:var(--red);color:#fff}

/* page container: 1280px, 24px padding, centred on both axes */
.page{
  max-width:1280px;margin:0 auto;padding:24px;
  min-height:100svh;display:flex;align-items:center;justify-content:center;
}

/* the one card */
.card{
  width:100%;max-width:448px;text-align:center;
  display:flex;flex-direction:column;align-items:center;
}

/* 1 — availability */
.status{
  display:inline-flex;align-items:center;gap:.6rem;
  font-family:var(--fm);font-weight:400;font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--label);
}
.status i{width:5px;height:5px;border-radius:50%;background:var(--red);flex:none}

/* 2 — portrait */
.shot{margin-top:2rem;width:200px}
.shot img{width:100%}

/* 3 — wordmark */
.mark{
  font-family:var(--fh);font-weight:800;color:var(--white);
  font-size:38px;letter-spacing:-.03em;line-height:1;margin-top:1.5rem;
}

/* 4 — one line of prose */
.line{margin-top:1rem;max-width:34ch;color:var(--body)}

/* 5 — one credential, a single figure */
.cred{
  margin-top:1.5rem;font-family:var(--fm);font-weight:500;font-size:11px;
  letter-spacing:.18em;text-transform:uppercase;color:var(--bright);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding:.8rem 0;width:100%;
}

/* 6 — the single CTA */
.btn{
  margin-top:1.75rem;width:100%;
  display:inline-block;font-family:var(--fb);font-weight:500;font-size:15px;
  color:#fff;background:var(--red);padding:.95rem 1.5rem;border-radius:2px;
  transition:opacity .2s ease;
}

/* 7 — small links */
.links{margin-top:1.5rem;display:flex;gap:1.75rem;justify-content:center}
.links a{
  font-family:var(--fm);font-weight:400;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--mid);
  padding-bottom:2px;border-bottom:1px solid var(--line);
  transition:color .2s ease,border-color .2s ease;
}

/* hover only where a pointer can actually hover */
@media(hover:hover){
  .btn:hover{opacity:.85}
  .links a:hover{color:var(--white);border-color:rgba(255,255,255,.35)}
}
a:focus-visible{outline:2px solid var(--red);outline-offset:4px;border-radius:2px}

@media(max-width:420px){
  .mark{font-size:32px}
  .shot{width:168px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<main class="page">
  <article class="card">

    <p class="status"><i></i>Available for new projects</p>

    <figure class="shot">
      <img src="images/victor-cutout.png" alt="Victor Adisa" width="900" height="1138">
    </figure>

    <h1 class="mark">VIKADY</h1>

    <p class="line">Strategy, content, video, design, websites, ads and analytics — all under one roof.</p>

    <p class="cred">5.2M impressions generated in 7 months</p>

    <a class="btn" href="https://calendly.com/adisavictor4/30min">Book a free strategy call</a>

    <nav class="links">
      <a href="https://www.instagram.com/thevictoradisa">Instagram</a>
      <a href="https://www.linkedin.com/in/victor-adisa-4a1778222">LinkedIn</a>
    </nav>

  </article>
</main>

</body>
</html>
